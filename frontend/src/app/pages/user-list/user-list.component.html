<div class="bg-white shadow rounded-lg p-6 border border-gray-200">
  
    <div class="flex justify-between items-center">
  
        <h1 class="text-2xl font-bold text-gray-800">Users</h1>
      
        <button class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition">
          + Create User
        </button>
      
      </div>
    <p class="text-gray-600 mb-6">Here you can see all user and create, edit or delete.</p>
  
    @if(isLoading) {
      <div class="flex justify-center items-center py-10">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
      </div>
    } @else {
      
      @if(data.length === 0) {
        <div class="text-center py-10 bg-gray-50 rounded-lg border border-gray-100">
          <p class="text-gray-500 font-medium">There are no users.</p>
        </div>
      } @else {
        <div class="overflow-y-auto h-[600px]">
          <table class="min-w-full divide-y divide-gray-200 border border-gray-200 rounded-lg"> 
            <thead class="bg-gray-50 sticky top-[-1px] z-10">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fullname</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Roles</th>
                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
              </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
              @for (user of data; track user.id) {
                <tr class="hover:bg-gray-50 transition-colors">
                  
                  <td class="px-6 py-4 whitespace-nowrap">
                    <span class="text-sm font-medium text-gray-900">{{ user.fullname }}</span>
                  </td>
                  <td class="px-6 py-4 whitespace-nowrap">
                    <span class="text-sm font-medium text-gray-900">{{ user.email }}</span>
                  </td>
                  <td class="px-6 py-4 whitespace-nowrap">
                    <span class="text-sm font-medium text-gray-900">{{ user.roles }}</span>
                  </td>

                  <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                      <button class="text-orange-600 hover:text-orange-900 bg-orange-50 hover:bg-orange-100 px-3 mr-4 py-1.5 transition rounded-md">Edit</button>
                      <button class="text-red-600 hover:text-red-900 bg-red-50 hover:bg-red-100 px-3 py-1.5 transition rounded-md">Delete</button>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      }
    }
</div>
