<div class="bg-white shadow rounded-lg p-6 border border-gray-200">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Request Leave</h2>

    @if (errors?.length){
        <div class="mb-4 p-3 bg-red-100 border-l-4 border-red-500 text-red-700 rounded shadow-sm">
          <p class="font-semibold">Invalid Form:</p>
          @for (error of errors; track $index) {
              <p>{{ error }}</p>
          }
        </div>
      }

    <form [formGroup]="requestForm" (ngSubmit)="onSubmit()" class="space-y-5">
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="type">Leave Type</label>
            <select formControlName="type" id="type"
                    class="w-full border border-gray-300 rounded-md shadow-sm px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white text-gray-800 transition">
                <option [value]="0">Annual Leave</option>
                <option [value]="1">Sick Leave</option>
                <option [value]="2">Unpaid Leave</option>
            </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="startDate">Start Date</label>
                <input type="date" [min]="minDate" formControlName="startDate" id="startDate"
                       class="w-full border border-gray-300 rounded-md shadow-sm px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-800 transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="endDate">End Date</label>
                <input type="date" [min]="minDate" formControlName="endDate" id="endDate"
                       class="w-full border border-gray-300 rounded-md shadow-sm px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-800 transition">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="reason">Reason</label>
            <textarea formControlName="reason" maxlength="250" rows="3" id="reason"
                      placeholder="Optional: Please provide a brief reason..."
                      class="w-full border border-gray-300 rounded-md shadow-sm px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-800 placeholder-gray-400 transition"></textarea>
        </div>

        <div class="flex justify-end pt-2">
            <button type="submit" 
                    [disabled]="requestForm.invalid"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-md shadow-sm transition disabled:bg-blue-300 disabled:cursor-not-allowed">
                Submit Request
            </button>
        </div>

    </form>
</div>
