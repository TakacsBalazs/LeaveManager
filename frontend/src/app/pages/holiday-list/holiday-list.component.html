<div class="bg-white shadow rounded-lg p-6 border border-gray-200">
  
    <div class="flex justify-between items-center">
  
        <h1 class="text-2xl font-bold text-gray-800">Holidays</h1>
      
        <button class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition text-base" (click)="openModal()">
          + Create Holiday
        </button>
      
      </div>
    <p class="text-gray-600 mb-6">Here you can see all holidays and create or delete.</p>
  
    @if(isLoading) {
      <div class="flex justify-center items-center py-10">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
      </div>
    } @else {
      <form [formGroup]="filterForm" (ngSubmit)="onSubmitQuery()" 
          class="flex flex-col md:flex-row items-end gap-4 bg-white p-5 rounded-xl shadow-sm border border-gray-100 mb-6">

        <div class="flex-1 w-full">
          <label class="block text-sm font-medium text-gray-700 mb-1" for="minDate">Min Date</label>
          <input type="date" formControlName="minDate" id="minDate"
                class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-gray-700 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>

        <div class="flex-1 w-full">
          <label class="block text-sm font-medium text-gray-700 mb-1" for="maxDate">Max Date</label>
          <input type="date" formControlName="maxDate" id="maxDate"
                class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-700 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>

        <div class="w-full md:w-auto">
          <button type="submit" 
                  class="w-full md:w-auto flex items-center justify-center gap-2 rounded-lg bg-blue-600 px-8 py-2 font-medium text-white shadow-sm transition-all hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">Filter</button>
        </div>
      </form>
      @if(data.length === 0) {
        <div class="text-center py-10 bg-gray-50 rounded-lg border border-gray-100">
          <p class="text-gray-500 font-medium">There are no holidays.</p>
        </div>
      } @else {
        <div class="overflow-y-auto h-[450px]">
          <table class="min-w-full divide-y divide-gray-200 border border-gray-200 rounded-lg"> 
            <thead class="bg-gray-50 sticky top-[-1px] z-10">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
              </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
              @for (holiday of data; track holiday.id) {
                <tr class="hover:bg-gray-50 transition-colors">
                  
                  <td class="px-6 py-4 whitespace-nowrap">
                    <span class="text-sm font-medium text-gray-900">{{ holiday.name }}</span>
                  </td>
                  <td class="px-6 py-4 whitespace-nowrap">
                    <span class="text-sm font-medium text-gray-900">{{ holiday.date }}</span>
                  </td>

                  <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                      <button class="text-red-600 hover:text-red-900 bg-red-50 hover:bg-red-100 px-3 py-1.5 transition rounded-md" (click)="openConfirm(holiday.id)">Delete</button>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      }
    }
</div>

@if(isModalOpen){
    <app-holiday-form (saveForm)="handleCreateHoliday($event)" (closeForm)="closeModal()" [errors]="errors"/>
}

@if(isConfirmOpen){
    <app-confirm-modal  title="Delete Holiday" message="Are you sure you want to delete this holiday?" (confirm)="onDelete()" (cancel)="isConfirmOpen = false"/>
}
