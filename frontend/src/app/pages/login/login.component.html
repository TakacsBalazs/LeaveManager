<div class="max-w-md mx-auto mt-10 bg-white p-8 border border-gray-300 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Sign In</h2>
  
    @if (errors) {
      <div class="mb-4 p-3 bg-red-100 border-l-4 border-red-500 text-red-700 rounded shadow-sm">
        <p class="font-semibold">Invalid Sign In:</p>
        @for (error of errors; track $index) {
            <p>{{ error }}</p>
        }
      </div>
    }
  
    <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-4">
      
      <div>
        <label class="block text-sm font-medium text-gray-700">E-mail</label>
        <input type="email" formControlName="email" 
               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
      </div>
  
      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" formControlName="password" 
               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
      </div>
  
      <button type="submit" 
              [disabled]="loginForm.invalid"
              class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors">
        Sign In
      </button>
      
    </form>
  </div>
