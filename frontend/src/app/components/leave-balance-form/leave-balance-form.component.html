<div class="fixed inset-0 bg-gray-800 bg-opacity-60 overflow-y-auto h-full w-full flex items-center justify-center z-50">
  
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
      
      <h2 class="text-2xl font-bold text-gray-800 mb-6">{{ leaveBalance ? 'Edit Leave Balance' : 'Create Leave Balance' }}</h2>

      @if (errors.length){
        <div class="mb-4 p-3 bg-red-100 border-l-4 border-red-500 text-red-700 rounded shadow-sm">
          <p class="font-semibold">Invalid Form:</p>
          @for (error of errors; track $index) {
              <p>{{ error }}</p>
          }
        </div>
      }
  
      <form [formGroup]="leaveBalanceForm" (ngSubmit)="onSubmit()" class="space-y-4">
        
        @if(!leaveBalance){
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="userId">User</label>
                <select id="userId" formControlName="userId" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        @for (user of users; track user.id) {
                          <option [value]="user.id">{{user.fullname}}</option>
                        }
                </select>
              </div>
        }
  
        @if(!leaveBalance){
            <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="year">Year</label>
            <input type="number" formControlName="year" id="year"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        }

        @if(!leaveBalance){
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2" for="type">Type</label>
                <select id="type" formControlName="type" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="AnnualLeave">Annual Leave</option>
                    <option value="SickLeave">Sick Leave</option>
                    <option value="Unpaid">Unpaid Leave</option>
                </select>
            </div>
        }

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="totalDays">Total Days</label>
            <input type="number" formControlName="totalDays" id="totalDays"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        @if(!leaveBalance){
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="usedDays">Used Days</label>
                <input type="number" formControlName="usedDays" id="usedDays"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        }

        <div class="flex justify-end space-x-3 mt-8 pt-4 border-t border-gray-100">
          <button type="button" (click)="onCancel()" 
                  class="px-5 py-2 text-sm font-medium text-red-700 bg-red-100 rounded-lg hover:bg-red-200">Cancel</button>
          <button type="submit" 
                    class="px-5 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 shadow-sm">{{leaveBalance ? 'Edit' : 'Create'}}</button>
        </div>
      </form>
    </div>
  </div>
